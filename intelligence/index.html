<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡appa! Intelligence · Hablá con tu negocio</title>
  <meta name="description" content="Un agente de IA privado, conectado a los datos de tu empresa, que responde en segundos. ¡appa! Intelligence, powered by BoulderTech.">
  <meta name="theme-color" content="#121111">
  <!-- Borrar esta línea cuando la web se publique oficialmente -->
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="¡appa! Intelligence · Hablá con tu negocio">
  <meta property="og:description" content="Un agente de IA privado, conectado a los datos de tu empresa, que responde en segundos.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <!-- ============ NAVBAR ============ -->
  <header class="nav" data-nav>
    <div class="container nav-inner">
      <a class="brand" href="#top" aria-label="¡appa! Intelligence, ir al inicio">
        <img class="brand-logo" src="assets/logo-appa-white.svg" alt="" width="104" height="30">
        <span class="brand-vertical">Intelligence</span>
      </a>
      <nav class="nav-links" id="nav-menu" aria-label="Principal">
        <ul data-slot="nav"></ul>
        <a class="btn btn-primary btn-sm nav-cta" href="#contacto" data-cta="meeting">Agendá una reunión</a>
      </nav>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Abrir menú" data-nav-toggle></button>
    </div>
  </header>

  <main id="main">
    <!-- ============ 1. HERO ============ -->
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="eyebrow reveal" data-slot="hero.eyebrow"></p>
          <h1 id="hero-title" class="hero-title reveal" data-slot="hero.title"></h1>
          <p class="hero-sub reveal" data-slot="hero.subtitle"></p>
          <p class="hero-kicker reveal" data-slot="hero.kicker"></p>
          <div class="hero-ctas reveal">
            <a class="btn btn-primary btn-lg" href="#contacto" data-cta="meeting" data-slot="hero.ctaPrimary"></a>
            <a class="btn btn-ghost btn-lg" href="#demo" data-slot="hero.ctaSecondary"></a>
          </div>
          <p class="hero-brand reveal">
            <span class="hero-brand-name">¡appa! Intelligence</span>
            <span class="sep" aria-hidden="true">·</span>
            <span class="powered">powered by BoulderTech</span>
          </p>
          <ul class="trust reveal" data-slot="hero.trust"></ul>
        </div>
        <div class="hero-visual reveal">
          <div class="hero-chat" data-hero-chat aria-label="Ejemplo de conversación con ¡appa! Intelligence" role="img"></div>
        </div>
      </div>
    </section>

    <!-- ============ 2. PROBLEMA → SOLUCIÓN ============ -->
    <section class="section" id="problema" aria-labelledby="problem-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-slot="problem.eyebrow"></p>
          <h2 id="problem-title" data-slot="problem.title"></h2>
          <p class="section-sub" data-slot="problem.subtitle"></p>
        </header>
        <div class="compare" data-slot="problem.rows"></div>
      </div>
    </section>

    <!-- ============ 3. DEMO POR ÁREA ============ -->
    <section class="section section-demo" id="demo" aria-labelledby="demo-title">
      <div class="demo-glow" aria-hidden="true"></div>
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-slot="demo.eyebrow"></p>
          <h2 id="demo-title" data-slot="demo.title"></h2>
          <p class="section-sub" data-slot="demo.subtitle"></p>
        </header>

        <div class="demo" id="demo-app">
          <div class="demo-tabs-wrap">
            <div class="demo-tabs" role="tablist" aria-label="Áreas de la empresa" data-demo-tabs></div>
          </div>

          <div class="demo-panel" id="demo-panel" role="tabpanel" tabindex="-1" data-demo-panel>
            <div class="demo-main">
              <p class="chips-label" id="chips-label">Preguntas sugeridas</p>
              <div class="chips" role="group" aria-labelledby="chips-label" data-demo-chips></div>
              <div class="demo-chat" data-demo-chat></div>
              <p class="demo-disclaimer">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
                <span data-slot="demo.disclaimer"></span>
              </p>
            </div>
            <aside class="area-card" aria-label="Sobre esta área" data-demo-card></aside>
          </div>
          <p class="sr-only" aria-live="polite" data-demo-announcer></p>
        </div>
      </div>
    </section>

    <!-- ============ 4. CÓMO FUNCIONA ============ -->
    <section class="section" id="como-funciona" aria-labelledby="how-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-slot="how.eyebrow"></p>
          <h2 id="how-title" data-slot="how.title"></h2>
          <p class="section-sub" data-slot="how.subtitle"></p>
        </header>
        <div class="timeline" data-timeline>
          <div class="timeline-track" aria-hidden="true"><span class="timeline-fill"></span></div>
          <ol class="steps" data-slot="how.steps"></ol>
        </div>
        <div class="speed-badge reveal" data-slot="how.badge"></div>
      </div>
    </section>

    <!-- ============ 5. SEGURIDAD ============ -->
    <section class="section section-security" id="seguridad" aria-labelledby="security-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-slot="security.eyebrow"></p>
          <h2 id="security-title" data-slot="security.title"></h2>
          <p class="section-sub" data-slot="security.subtitle"></p>
        </header>
        <div class="security-grid">
          <figure class="perimeter reveal" data-slot="security.diagram"></figure>
          <ul class="security-points" data-slot="security.points"></ul>
        </div>
      </div>
    </section>

    <!-- ============ 6. INTEGRACIONES ============ -->
    <section class="section" id="integraciones" aria-labelledby="int-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-slot="integrations.eyebrow"></p>
          <h2 id="int-title" data-slot="integrations.title"></h2>
          <p class="section-sub" data-slot="integrations.subtitle"></p>
        </header>
        <ul class="integrations" data-slot="integrations.items"></ul>
        <p class="integrations-more reveal" data-slot="integrations.more"></p>
      </div>
    </section>

    <!-- ============ 7. RESULTADOS ============ -->
    <section class="section section-results" id="resultados" aria-labelledby="results-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-slot="results.eyebrow"></p>
          <h2 id="results-title" data-slot="results.title"></h2>
          <p class="section-sub" data-slot="results.subtitle"></p>
        </header>
        <ul class="counters" data-slot="metrics.counters"></ul>
        <h3 class="cases-title reveal" data-slot="results.casesTitle"></h3>
        <ul class="cases" data-slot="metrics.cases"></ul>

        <div class="backing reveal" data-slot="backing"></div>

        <!-- Testimonios: se muestran solo si data/testimonials.js tiene alguno aprobado -->
        <div class="testimonials" data-slot="testimonials" hidden></div>
      </div>
    </section>

    <!-- ============ 8. POR QUÉ ============ -->
    <section class="section" id="por-que" aria-labelledby="why-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-slot="why.eyebrow"></p>
          <h2 id="why-title" data-slot="why.title"></h2>
        </header>
        <ul class="why" data-slot="why.items"></ul>
      </div>
    </section>

    <!-- ============ 9. CTA + FORMULARIO ============ -->
    <section class="section section-cta" id="contacto" aria-labelledby="cta-title">
      <div class="container cta-grid">
        <div class="cta-copy reveal">
          <p class="eyebrow" data-slot="cta.eyebrow"></p>
          <h2 id="cta-title" data-slot="cta.title"></h2>
          <p class="section-sub" data-slot="cta.subtitle"></p>
          <ul class="cta-bullets" data-slot="cta.bullets"></ul>
          <a class="btn btn-ghost" href="#" target="_blank" rel="noopener" data-calendar-link hidden></a>
        </div>

        <div class="form-card reveal">
          <form class="lead-form" novalidate data-lead-form>
            <div class="field">
              <label for="f-name" data-slot="cta.form.name"></label>
              <input id="f-name" name="name" type="text" autocomplete="name" required>
              <p class="field-error" id="f-name-err"></p>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="f-company" data-slot="cta.form.company"></label>
                <input id="f-company" name="company" type="text" autocomplete="organization" required>
                <p class="field-error" id="f-company-err"></p>
              </div>
              <div class="field">
                <label for="f-role" data-slot="cta.form.role"></label>
                <input id="f-role" name="role" type="text" autocomplete="organization-title" required>
                <p class="field-error" id="f-role-err"></p>
              </div>
            </div>
            <div class="field">
              <label for="f-email" data-slot="cta.form.email"></label>
              <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required>
              <p class="field-error" id="f-email-err"></p>
            </div>
            <div class="field">
              <label for="f-question" data-slot="cta.form.question"></label>
              <textarea id="f-question" name="question" rows="3"></textarea>
            </div>
            <button class="btn btn-primary btn-lg btn-block" type="submit" data-slot="cta.form.submit"></button>
            <p class="form-privacy" data-slot="cta.form.privacy"></p>
          </form>
          <div class="form-success" data-form-success hidden tabindex="-1">
            <span class="success-icon" aria-hidden="true"></span>
            <h3 data-slot="cta.form.successTitle"></h3>
            <p data-success-text></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ 10. FOOTER ============ -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a class="brand" href="#top" aria-label="¡appa! Intelligence, volver arriba">
          <img class="brand-logo" src="assets/logo-appa-white.svg" alt="" width="104" height="30">
          <span class="brand-vertical">Intelligence</span>
        </a>
        <p class="footer-tagline" data-slot="footer.tagline"></p>
        <p class="powered" data-slot="footer.poweredBy"></p>
      </div>
      <div class="footer-contact">
        <p class="mini-label" data-slot="footer.contactLabel"></p>
        <p data-footer-contact></p>
      </div>
    </div>
    <div class="container footer-bottom">
      <p>© <span data-year></span> ¡appa! · <span data-slot="footer.legal"></span></p>
    </div>
  </footer>

  <noscript>
    <p class="noscript">Para ver esta página necesitás activar JavaScript.</p>
  </noscript>

  <!-- Contenido editable -->
  <script src="data/config.js"></script>
  <script src="data/content.js"></script>
  <script src="data/demos.js"></script>
  <script src="data/metrics.js"></script>
  <script src="data/testimonials.js"></script>
  <!-- Código -->
  <script src="js/icons.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
